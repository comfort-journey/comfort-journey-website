# Comfort Journey - Production Nginx Reverse Proxy & Frontend Server
# Primary Canonical Domain: https://www.comfortjourney.in
# 301 Permanent Redirects for comfortjourneyy.com & non-www comfortjourney.in
# 301 Permanent Redirects for legacy Wix paths (/product-page/*, /blank*)

# --------------------------------------------------------------------------
# HTTP Server (Port 80) - Redirect all traffic to Primary HTTPS Canonical Domain
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name comfortjourneyy.com www.comfortjourneyy.com comfortjourney.in www.comfortjourney.in localhost;

    # Keep Health Check available on HTTP for AWS Load Balancers (Best Practice)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Clean legacy paths from previous Wix template (e.g., /product-page/*, /blank*)
    location ~* ^/(?:product-page|blank) {
        return 301 https://www.comfortjourney.in/;
    }

    # Redirect all HTTP requests to Primary HTTPS Canonical Domain
    location / {
        return 301 https://www.comfortjourney.in$request_uri;
    }
}

# --------------------------------------------------------------------------
# 301 Permanent Redirect: comfortjourneyy.com -> https://www.comfortjourney.in
# Preserves link equity, SEO rankings, and route paths for search crawlers
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comfortjourneyy.com www.comfortjourneyy.com;

    ssl_certificate /etc/nginx/ssl/comfortjourney.crt;
    ssl_certificate_key /etc/nginx/ssl/comfortjourney.key;

    # Clean legacy paths from previous Wix template (e.g., /product-page/*, /blank*)
    location ~* ^/(?:product-page|blank) {
        return 301 https://www.comfortjourney.in/;
    }

    location / {
        return 301 https://www.comfortjourney.in$request_uri;
    }
}

# --------------------------------------------------------------------------
# 301 Permanent Redirect: comfortjourney.in -> https://www.comfortjourney.in
# Canonicalizes non-www to primary www domain
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comfortjourney.in;

    ssl_certificate /etc/nginx/ssl/comfortjourney.crt;
    ssl_certificate_key /etc/nginx/ssl/comfortjourney.key;

    # Clean legacy paths from previous Wix template (e.g., /product-page/*, /blank*)
    location ~* ^/(?:product-page|blank) {
        return 301 https://www.comfortjourney.in/;
    }

    location / {
        return 301 https://www.comfortjourney.in$request_uri;
    }
}

# --------------------------------------------------------------------------
# Primary HTTPS Server - Canonical Domain (www.comfortjourney.in)
# --------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name www.comfortjourney.in localhost;

    # OpenSSL Certificates (Mounted via Docker Volume)
    ssl_certificate /etc/nginx/ssl/comfortjourney.crt;
    ssl_certificate_key /etc/nginx/ssl/comfortjourney.key;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Clean legacy paths from previous Wix template (e.g., /product-page/*, /blank*)
    location ~* ^/(?:product-page|blank) {
        return 301 https://www.comfortjourney.in/;
    }

    # Gzip Compression for Ultra-Fast Page Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Core Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Link '</llms.txt>; rel="describedby"; type="text/markdown"' always;

    # High-Performance Immutable Caching for Static Assets & Media
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React SPA & SSG Pre-rendered Pages Fallback
    # Handles all routes: /, /cms, /admin, /about, /blog, /ai-planner, /itinerary/:slug
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Directus Headless CMS Reverse Proxy
    # --------------------------------------------------------------------------
    location = /cms {
        return 301 /cms/;
    }

    location ^~ /cms/ {
        proxy_pass http://directus:8055/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # Serverless Gemini AI Concierge Reverse Proxy
    # --------------------------------------------------------------------------
    location ^~ /api/ai-planner {
        proxy_pass http://comfort_journey_ai_planner:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    # Health Check for AWS Application Load Balancer / ECS Target Group
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
