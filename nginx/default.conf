# Comfort Journey - Production Nginx Reverse Proxy & Frontend Server
# Supports dual domains: comfortjourneyy.com & comfortjourney.in + /cms routing

# --------------------------------------------------------------------------
# HTTP Server - Redirect all traffic to HTTPS
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name comfortjourneyy.com www.comfortjourneyy.com comfortjourney.in www.comfortjourney.in localhost;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Keep Health Check available on HTTP for AWS Load Balancers (Best Practice)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}

# --------------------------------------------------------------------------
# HTTPS Server - Main Secure Application
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comfortjourneyy.com www.comfortjourneyy.com comfortjourney.in www.comfortjourney.in localhost;

    # OpenSSL Certificates (Mounted via Docker Volume)
    ssl_certificate /etc/nginx/ssl/comfortjourney.crt;
    ssl_certificate_key /etc/nginx/ssl/comfortjourney.key;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;


    # Gzip Compression for Ultra-Fast Page Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Core Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # High-Performance Immutable Caching for Static Assets & Media
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React SPA & SSG Pre-rendered Pages Fallback
    # Handles all routes: /, /cms, /admin, /about, /blog, /ai-planner, /itinerary/:slug
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # OPTIONAL: Directus Headless CMS Reverse Proxy
    # Uncomment this block once the Docker Directus container is running on port 8055
    # --------------------------------------------------------------------------
    # location ^~ /cms/ {
    #     proxy_pass http://directus:8055/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Prefix /cms;
    #     proxy_cache_bypass $http_upgrade;
    #     client_max_body_size 100M;
    #     proxy_read_timeout 300s;
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 300s;
    # }

    # Health Check for AWS Application Load Balancer / ECS Target Group
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
