    <script>
      // Early theme bootstrap: Automatically syncs with visitor's device OS.
      // Respects manual user preference if toggled and saved in localStorage.
      try {
        var stored = localStorage.getItem('cj-theme');
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (sysDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
